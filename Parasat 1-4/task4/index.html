<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Table & Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="../task1/index.html">Task 1</a>
        <a href="../task2/index.html">Task 2</a>
        <a href="../task3/index.html">Task 3</a>
        <a href="index.html">Task 4</a>
        <a href="../task5/index.html">Task 5</a>
    </nav>

    <div class="main-container">

        <h1 id="page-title">Student Grades & Feedback</h1>

        <section class="section-box">
            <h2>Student Grades Table</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Subject</th>
                        <th>Grade</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td rowspan="2">Alice Smith</td>
                        <td>Mathematics</td>
                        <td>95</td>
                    </tr>
                    <tr>
                        <td>Physics</td>
                        <td>88</td>
                    </tr>
                    <tr class="highlight-row">
                        <td>Bob Johnson</td>
                        <td>Computer Science</td>
                        <td>92</td>
                    </tr>
                    <tr>
                        <td>Charlie Brown</td>
                        <td>Mathematics</td>
                        <td>78</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="section-box">
            <h2>Feedback Form</h2>
            <form class="feedback-form">
                
                <div class="form-group">
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="role">Your Role:</label>
                    <select id="role" name="role">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Do you like this website?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="like" value="yes" checked> Yes</label>
                        <label><input type="radio" name="like" value="no"> No</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="comments">Comments:</label>
                    <textarea id="comments" name="comments" rows="4" placeholder="Write your feedback here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Feedback</button>
            </form>
        </section>
        </div>


</body>
</html>
